services:
  app:
    image: loveyfacundo/appurbe:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:-}
      IDENTITY_BOOTSTRAP_TOKEN: ${IDENTITY_BOOTSTRAP_TOKEN:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-appurbe}:${POSTGRES_PASSWORD:-AppUrbe2026}@postgres:5432/${POSTGRES_DB:-appurbe}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-appurbe}:${RABBITMQ_PASSWORD:-appurbe_dev_only}@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      PENALIDAD_CANCELACION_LLEGADA_ARS: ${PENALIDAD_CANCELACION_LLEGADA_ARS:-1000}
      LIMITE_CANCELACIONES: ${LIMITE_CANCELACIONES:-3}
      PERIODO_CANCELACIONES_DIAS: ${PERIODO_CANCELACIONES_DIAS:-30}
      BLOQUEO_CANCELACIONES_HORAS: ${BLOQUEO_CANCELACIONES_HORAS:-24}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-appurbe-api}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=development}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-https://otlp-gateway-prod-sa-east-1.grafana.net/otlp}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health/ready', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appurbe}
      POSTGRES_USER: ${POSTGRES_USER:-appurbe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AppUrbe2026}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infraestructura/postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-appurbe}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-appurbe_dev_only}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
